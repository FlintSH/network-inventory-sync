# Local development only. PostgreSQL binds loopback and has no TLS in this example.
# export INVSYNC_DB_PASSWORD='choose-a-local-password'
# docker compose -f compose.example.yml up -d
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: invsync
      POSTGRES_USER: invsync
      POSTGRES_PASSWORD: ${INVSYNC_DB_PASSWORD:?Set INVSYNC_DB_PASSWORD first}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - invsync-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invsync -d invsync']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  invsync-data:
