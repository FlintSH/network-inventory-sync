name: Test and release
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: invsync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Paper 26.1.2 / PostgreSQL 17 + MariaDB 10.11 / Java 25
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: invsync
          POSTGRES_USER: invsync
          POSTGRES_PASSWORD: invsync-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U invsync -d invsync"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: invsync
          MARIADB_USER: invsync
          MARIADB_PASSWORD: invsync-test-only
          MARIADB_ROOT_PASSWORD: root-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      INVSYNC_TEST_DATABASE: invsync
      INVSYNC_TEST_HOST: 127.0.0.1
      INVSYNC_TEST_PORT: '5432'
      INVSYNC_TEST_USER: invsync
      INVSYNC_TEST_PASSWORD: invsync-test-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set commit version
        run: mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="1.0.${GITHUB_RUN_NUMBER}" -DgenerateBackupPoms=false
      - name: Unit and real PostgreSQL integration tests
        run: mvn -B -ntp clean verify dependency:build-classpath -Dmdep.outputFile=target/test-classpath.txt
      - name: Real MariaDB concurrency, fencing and rollback tests
        env:
          INVSYNC_TEST_TYPE: mariadb
          INVSYNC_TEST_PORT: '3306'
        run: mvn -B -ntp test -Dtest=StoreIntegrationTest
      - name: Real Paper NBT and PostgreSQL inventory lifecycle probe
        run: python3 scripts/smoke.py "target/network-inventory-sync-1.0.${GITHUB_RUN_NUMBER}.jar"
      - name: Real Paper NBT and MariaDB inventory lifecycle probe
        env:
          INVSYNC_TEST_TYPE: mariadb
          INVSYNC_TEST_PORT: '3306'
        run: python3 scripts/smoke.py "target/network-inventory-sync-1.0.${GITHUB_RUN_NUMBER}.jar"
      - name: Checksum tested artifact
        working-directory: target
        run: sha256sum network-inventory-sync-*.jar mariadb-java-client-*-sources.jar > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inventory-sync-${{ github.run_number }}
          overwrite: true
          path: |
            target/network-inventory-sync-*.jar
            target/mariadb-java-client-*-sources.jar
            target/SHA256SUMS
  release:
    name: Publish tested commit release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: inventory-sync-${{ github.run_number }}
          path: target
      - name: Verify tested artifact checksum
        working-directory: target
        run: sha256sum -c SHA256SUMS
      - name: Publish commit prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Network Inventory Sync 1.0.${GITHUB_RUN_NUMBER}" --prerelease --generate-notes
          fi
          gh release upload "$tag" target/network-inventory-sync-*.jar target/mariadb-java-client-*-sources.jar target/SHA256SUMS --clobber
